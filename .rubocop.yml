plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-capybara

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: diff_comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: diff_comma
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma

Style/SymbolArray:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/routes.rb"

## Rules I'm not sure about
Rails/SkipsModelValidations:
  AllowedMethods: ["touch"]

Rails/HasManyOrHasOneDependent:
  Enabled: false

# App is english only for now.
Rails/I18nLocaleTexts:
  Enabled: false

# find_by_password_reset_token! is a real method from has_secure_password
# (generates_token_for), not a dynamic finder; the cop's rewrite queries a
# nonexistent column.
Rails/DynamicFindBy:
  AllowedMethods: ["find_by_password_reset_token!"]

Rails/NotNullColumn:
  Exclude:
    - 'db/migrate/20260704110000_add_user_to_workouts_and_plans.rb'

Metrics/MethodLength:
  Max: 15
  AllowedMethods: setup
  Exclude:
    - 'db/seed_fixtures/workouts/**/*'

Metrics/ClassLength:
  Exclude:
    - 'db/seed_fixtures/workouts/**/*'
    - 'db/seed_fixtures/seed_exercises_with_variations.rb'

Metrics/AbcSize:
  Max: 20
  AllowedMethods: setup

AllCops:
  NewCops: enable
  Exclude:
    - '**/vendor/**/*' # This is needed for ci
    - 'bin/**/*'
    - 'db/schema.rb'
