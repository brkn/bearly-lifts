version: '3'
services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    container_name: ft_rails_postgres
    volumes:
      - ft_rails_postgres_data:/var/lib/postgresql
    command: >
      postgres
      -c 'max_connections=500'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

networks:
  default:
    name: myapp_default
volumes:
  ft_rails_postgres_data:
