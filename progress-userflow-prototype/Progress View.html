<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress — Bearly Lifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --screen: #16130f;
  --card:   #1f1b15;
  --raise:  #2d2619;
  --line:   rgba(255,255,255,.08);
  --line2:  rgba(255,255,255,.14);
  --ink:    #f3eee4;
  --sub:    #9b9184;
  --faint:  #6f665a;
  --ember:  #ff5a2c;
  --fresh:  #46d6a4;
  --amber:  #e6b450;
  --disp:   'Space Grotesk', system-ui, sans-serif;
  --mono:   'Space Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--screen);
  color: var(--ink);
  font-family: var(--disp);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

/* ── Page shell ─────────────────────────────────────────────────────────── */
.shell { height: 100vh; display: flex; flex-direction: column; }

/* ── Topbar ─────────────────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 38px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
.brand .wordmark { font-family: var(--mono); font-size: 12px; letter-spacing: 3px; font-weight: 700; }
.diamond { width: 8px; height: 8px; background: var(--ember); transform: rotate(45deg); border-radius: 1px; display: inline-block; }
.nav { display: flex; align-items: center; gap: 28px; }
.nav a { font-size: 14px; color: var(--sub); text-decoration: none; transition: color .12s; }
.nav a.active { color: var(--ink); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: var(--sub); margin-left: 4px;
}

/* ── Status badges ──────────────────────────────────────────────────────── */
.st {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  letter-spacing: .5px; padding: 2px 7px; border-radius: 6px;
  text-transform: uppercase; white-space: nowrap; border: 1px solid transparent;
}
.st.up    { color: var(--fresh); border-color: rgba(70,214,164,.4); background: rgba(70,214,164,.08); }
.st.stall { color: var(--amber); border-color: rgba(230,180,80,.4);  background: rgba(230,180,80,.08); }
.st.cold  { color: var(--faint); border-color: var(--line2); }

/* ── Chart atoms ────────────────────────────────────────────────────────── */
.chart-svg  { display: block; overflow: visible; }
.chart-axis { font-family: var(--mono); font-size: 9px; fill: var(--faint); letter-spacing: .3px; }

/* ── Body layout ────────────────────────────────────────────────────────── */
.body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* Rail */
.combo-rail {
  flex: 0 0 100%; display: flex; flex-direction: column; overflow: hidden;
  transition: flex-basis 0.42s cubic-bezier(0.4,0,0.2,1), border-color 0.3s ease;
  border-right: 1px solid transparent;
}
.detail .combo-rail { flex-basis: 316px; border-right-color: var(--line); }

/* Pane */
.combo-pane {
  flex: 1; min-width: 0; opacity: 0; pointer-events: none;
  transition: opacity 0.28s ease 0.32s; overflow: hidden; display: flex; flex-direction: column;
}
.detail .combo-pane { opacity: 1; pointer-events: auto; }

/* ── Index header (fades out in detail mode) ────────────────────────────── */
.idx-head {
  padding: 24px 38px 0; flex-shrink: 0; overflow: hidden;
  max-height: 130px; opacity: 1;
  transition: max-height 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease, padding 0.38s ease;
}
.detail .idx-head { max-height: 0; opacity: 0; padding-top: 0; }
.idx-h1       { font-size: 24px; font-weight: 700; letter-spacing: -.6px; margin-bottom: 3px; }
.idx-sum      { font-family: var(--mono); font-size: 11px; color: var(--sub); }
.idx-sum .u   { color: var(--fresh); }
.idx-sum .s   { color: var(--amber); }
.idx-verdict  {
  font-size: 17px; font-weight: 500; letter-spacing: -.3px; line-height: 1.35;
  margin-top: 10px; max-width: 660px; color: var(--ink);
}
.idx-verdict em { font-style: normal; color: var(--ember); }

/* Rail label (appears in detail mode) */
.rail-lbl {
  font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--faint); overflow: hidden;
  max-height: 0; opacity: 0; padding: 0 22px;
  transition: max-height 0.3s ease 0.12s, opacity 0.2s ease 0.18s, padding 0.3s ease 0.12s;
}
.detail .rail-lbl { max-height: 40px; opacity: 1; padding: 16px 22px 8px; }

/* Rows scroll */
.rows-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 0 24px;
  transition: padding 0.38s ease;
}
.detail .rows-scroll { padding: 0; }
.rows-scroll::-webkit-scrollbar       { width: 4px; }
.rows-scroll::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
.rows-scroll::-webkit-scrollbar-track { background: transparent; }

/* Feed rows — card in index, slim in detail */
.feed-row {
  display: flex; align-items: center; gap: 18px;
  padding: 15px 24px 15px 26px; margin: 0 24px 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  position: relative; overflow: hidden; cursor: pointer;
  transition: padding 0.38s ease, margin 0.38s ease, border-radius 0.38s ease,
              background 0.3s ease, border-color 0.3s ease;
}
.feed-row::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--sub); transition: background 0.2s ease;
}
.feed-row.up::before    { background: var(--fresh); }
.feed-row.stall::before { background: var(--amber); }
.feed-row.cold::before  { background: var(--faint); }

.detail .feed-row {
  padding: 10px 16px 10px 22px; margin: 0;
  border-color: transparent; border-radius: 0; background: transparent;
}
.detail .feed-row:hover        { background: rgba(255,255,255,.03); }
.detail .feed-row.sel          { background: var(--card); }
.detail .feed-row.sel::before  { background: var(--ember) !important; }

/* Row — left content */
.fr-main    { flex: 1; min-width: 0; }
.fr-nameline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fr-name {
  font-size: 14.5px; font-weight: 600; letter-spacing: -.2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink);
  transition: font-size 0.3s ease, color 0.3s ease;
}
.detail .fr-name              { font-size: 13px; color: var(--sub); }
.detail .feed-row.sel .fr-name { color: var(--ink); }
.fr-muscle {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .5px;
  text-transform: uppercase; color: var(--faint); margin-top: 4px;
  overflow: hidden; max-height: 18px; opacity: 1;
  transition: max-height 0.35s ease, opacity 0.22s ease, margin-top 0.35s ease;
}
.detail .fr-muscle { max-height: 0; opacity: 0; margin-top: 0; }
.fr-verdict-text {
  font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.4;
  overflow: hidden; max-height: 44px; opacity: 1;
  transition: max-height 0.35s ease, opacity 0.22s ease, margin-top 0.35s ease;
}
.detail .fr-verdict-text { max-height: 0; opacity: 0; margin-top: 0; }

/* Row — sparkline (right-aligned so clip shows the most-recent end) */
.fr-spark-wrap {
  width: 160px; flex-shrink: 0; overflow: hidden;
  display: flex; justify-content: flex-end; line-height: 0;
  transition: width 0.38s cubic-bezier(0.4,0,0.2,1);
}
.detail .fr-spark-wrap { width: 64px; }

/* Row — "Reads as" rec column (collapses in detail) */
.fr-rec {
  width: 152px; flex-shrink: 0; text-align: right; overflow: hidden; opacity: 1;
  transition: width 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease;
}
.detail .fr-rec { width: 0; opacity: 0; }
.fr-rec-k { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
.fr-rec-v { font-size: 14px; font-weight: 600; letter-spacing: -.3px; margin-top: 5px; white-space: nowrap; }
.fr-rec-v.up    { color: var(--fresh); }
.fr-rec-v.stall { color: var(--amber); }
.fr-rec-v.cold  { color: var(--ember); }

/* ── Detail pane ────────────────────────────────────────────────────────── */
.cp-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px; height: 54px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.cp-back {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .3px; color: var(--sub);
  cursor: pointer; padding: 7px 13px; white-space: nowrap;
  background: var(--card); border: 1px solid var(--line2); border-radius: 8px;
  user-select: none; transition: color .12s, border-color .12s;
}
.cp-back:hover { color: var(--ink); border-color: rgba(255,255,255,.24); }
.cp-readout { display: flex; gap: 24px; }
.cp-readout .r .k {
  font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--faint);
}
.cp-readout .r .val {
  font-family: var(--mono); font-size: 15px; font-weight: 700; margin-top: 2px;
}
.cp-readout .r .val.em { color: var(--ember); }

.cp-inner {
  flex: 1; padding: 18px 26px; display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.cp-name { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.cp-sc   {
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; margin-bottom: 12px;
}
.cp-chartwrap { flex-shrink: 0; margin-bottom: 14px; }
.cp-tbl {
  border-top: 1px solid var(--line); flex: 1; min-height: 0; overflow-y: auto;
}
.cp-tbl::-webkit-scrollbar       { width: 4px; }
.cp-tbl::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
.cp-tbl::-webkit-scrollbar-track { background: transparent; }
.cp-trow {
  display: grid; grid-template-columns: 72px 1fr 52px 72px;
  align-items: center; gap: 10px; padding: 7px 4px;
  border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px;
}
.cp-trow.h   { color: var(--faint); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
.cp-trow .dt  { color: var(--sub); }
.cp-trow .set { color: var(--ink); }
.cp-trow .rir { color: var(--amber); }
.cp-trow .e1  { text-align: right; font-weight: 700; }
.cp-trow.cur  { background: rgba(255,90,44,.07); border-radius: 6px; }
</style>
</head>
<body>
<div class="shell" id="app">
  <header class="topbar">
    <a class="brand" href="#"><span class="diamond"></span><span class="wordmark">Bearly Lifts</span></a>
    <nav class="nav">
      <a href="#">Plan</a>
      <a href="#">History</a>
      <a class="active" href="#">Progress</a>
      <span class="avatar">B</span>
    </nav>
  </header>
  <div class="body">
    <div class="combo-rail" id="combo-rail"></div>
    <div class="combo-pane" id="combo-pane"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script>
(function () {
  function init() {
    var P = window.PROGRESS;
    if (!P) return;

    var toneRank = { cold: 0, stall: 1, up: 2 };
    var ordered = P.list.slice().sort(function (a, b) {
      var ta = toneRank[a.tone] !== undefined ? toneRank[a.tone] : 3;
      var tb = toneRank[b.tone] !== undefined ? toneRank[b.tone] : 3;
      if (ta !== tb) return ta - tb;
      return b.days - a.days;
    });

    var app    = document.getElementById('app');
    var rail   = document.getElementById('combo-rail');
    var pane   = document.getElementById('combo-pane');

    var climbing = ordered.filter(function (e) { return e.tone === 'up';   }).length;
    var stalling = ordered.filter(function (e) { return e.tone === 'stall'; }).length;
    var cold     = ordered.filter(function (e) { return e.tone === 'cold'; }).length;

    /* ── Index header ──────────────────────────────────────────────────── */
    var idxHead = document.createElement('div');
    idxHead.className = 'idx-head';
    idxHead.innerHTML =
      '<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:3px;">' +
        '<h1 class="idx-h1">Progress</h1>' +
        '<span class="idx-sum">' + P.list.length + ' lifts\u2009\xb7\u2009' +
          '<b class="u">' + climbing + ' climbing</b>\u2009\xb7\u2009' +
          '<b class="s">' + stalling + ' holding</b>\u2009\xb7\u2009' +
          '<b>' + cold + ' cold</b>' +
        '</span>' +
      '</div>' +
      '<p class="idx-verdict"><em>Incline Press</em> has been at 15\u202fkg for three sessions. ' +
        '<em>Calves</em> have not come up in five weeks.</p>';
    rail.appendChild(idxHead);

    /* ── Rail label (detail only) ──────────────────────────────────────── */
    var railLbl = document.createElement('div');
    railLbl.className = 'rail-lbl';
    railLbl.textContent = 'Lifts\u2009\xb7\u2009' + P.list.length + '\u2009\xb7\u2009worst first';
    rail.appendChild(railLbl);

    /* ── Scroll container ──────────────────────────────────────────────── */
    var scroll = document.createElement('div');
    scroll.className = 'rows-scroll';
    rail.appendChild(scroll);

    function badgeLabel(ex) {
      if (ex.tone === 'cold')          return 'COLD';
      if (ex.next.kind === 'rebase')   return 'REBASE';
      if (ex.next.kind === 'hold')     return 'HOLD';
      return ex.next.label;
    }
    function recVerdict(ex) {
      if (ex.tone === 'cold')          return 'Cold\u2009\xb7\u2009' + ex.days + 'd idle';
      if (ex.next.kind === 'rebase')   return 'Plateau\u2009\xb7\u2009rebase';
      if (ex.next.kind === 'hold')     return 'Stalled\u2009\xb7\u2009hold\u2009' + ex.currentW;
      return 'Climbing\u2009\xb7\u2009' + ex.next.label;
    }

    /* ── Build rows ────────────────────────────────────────────────────── */
    ordered.forEach(function (ex) {
      var row = document.createElement('div');
      row.className = 'feed-row ' + ex.tone;

      var main = document.createElement('div');
      main.className = 'fr-main';

      var nameline = document.createElement('div');
      nameline.className = 'fr-nameline';

      var nm = document.createElement('div');
      nm.className = 'fr-name';
      nm.textContent = ex.name;

      var badge = document.createElement('span');
      badge.className = 'st ' + ex.tone;
      badge.style.flexShrink = '0';
      badge.textContent = badgeLabel(ex);

      nameline.appendChild(nm);
      nameline.appendChild(badge);

      var mus = document.createElement('div');
      mus.className = 'fr-muscle';
      mus.textContent = ex.muscle;

      var vd = document.createElement('div');
      vd.className = 'fr-verdict-text';
      vd.textContent = ex.verdict;

      main.appendChild(nameline);
      main.appendChild(mus);
      main.appendChild(vd);

      var sparkWrap = document.createElement('div');
      sparkWrap.className = 'fr-spark-wrap';
      var sparkNode = document.createElement('span');
      sparkNode.setAttribute('data-chart', 'mini');
      sparkNode.setAttribute('data-ex', ex.key);
      sparkWrap.appendChild(sparkNode);

      var rec = document.createElement('div');
      rec.className = 'fr-rec';
      rec.innerHTML =
        '<div class="fr-rec-k">Reads as</div>' +
        '<div class="fr-rec-v ' + ex.tone + '">' + recVerdict(ex) + '</div>';

      row.appendChild(main);
      row.appendChild(sparkWrap);
      row.appendChild(rec);

      row.addEventListener('click', function () {
        if (!app.classList.contains('detail')) app.classList.add('detail');
        scroll.querySelectorAll('.feed-row').forEach(function (r) { r.classList.remove('sel'); });
        row.classList.add('sel');
        renderPane(ex);
      });

      scroll.appendChild(row);
      if (window.__chartRender) window.__chartRender(sparkNode);
    });

    /* ── Back button (delegated) ───────────────────────────────────────── */
    pane.addEventListener('click', function (e) {
      if (e.target.closest('.cp-back')) {
        app.classList.remove('detail');
        scroll.querySelectorAll('.feed-row').forEach(function (r) { r.classList.remove('sel'); });
        pane.innerHTML = '';
      }
    });

    /* ── Detail pane renderer ──────────────────────────────────────────── */
    function renderPane(ex) {
      pane.innerHTML = '';

      /* Top bar: back button (left) + readout stats (right) */
      var topbar = document.createElement('div');
      topbar.className = 'cp-topbar';

      var back = document.createElement('div');
      back.className = 'cp-back';
      back.innerHTML = '\u2190 All lifts';
      topbar.appendChild(back);

      var rdout = document.createElement('div');
      rdout.className = 'cp-readout';
      var deltaTxt = (ex.deltaPct >= 0 ? '+' : '') + ex.deltaPct + '%';
      [
        { k: 'Working',               v: ex.currentW + '\u202f\xd7\u202f' + ex.currentR, em: false },
        { k: 'Est.\u202f1RM',         v: ex.current + '\u202fkg',                         em: true  },
        { k: 'Since\u202f' + ex.startDate, v: deltaTxt,                                   em: false },
      ].forEach(function (item) {
        var r = document.createElement('div');
        r.className = 'r';
        r.innerHTML =
          '<div class="k">' + item.k + '</div>' +
          '<div class="val' + (item.em ? ' em' : '') + '">' + item.v + '</div>';
        rdout.appendChild(r);
      });
      topbar.appendChild(rdout);
      pane.appendChild(topbar);

      /* Inner: name, subtitle, chart, table */
      var inner = document.createElement('div');
      inner.className = 'cp-inner';

      var name = document.createElement('div');
      name.className = 'cp-name';
      name.textContent = ex.name;

      var sc = document.createElement('div');
      sc.className = 'cp-sc';
      sc.textContent =
        ex.muscle + '\u2009\xb7\u2009' +
        (ex.scheme ? ex.scheme.replace('_', '\u202f') : 'free weight') +
        '\u2009\xb7\u2009' + ex.workouts + ' workouts';

      var cw = document.createElement('div');
      cw.className = 'cp-chartwrap';
      var cn = document.createElement('span');
      cn.setAttribute('data-chart', 'hero');
      cn.setAttribute('data-ex', ex.key);
      cn.setAttribute('data-h', '210');
      cw.appendChild(cn);

      var tbl = document.createElement('div');
      tbl.className = 'cp-tbl';
      tbl.innerHTML =
        '<div class="cp-trow h">' +
          '<span class="dt">Date</span>' +
          '<span class="set">Best set</span>' +
          '<span class="rir">RIR</span>' +
          '<span class="e1">Est.\u202f1RM</span>' +
        '</div>';
      ex.points.forEach(function (pt, i) {
        var tr = document.createElement('div');
        tr.className = 'cp-trow' + (i === ex.points.length - 1 ? ' cur' : '');
        var rir = (pt.rir !== null && pt.rir !== undefined) ? pt.rir : '\u2014';
        tr.innerHTML =
          '<span class="dt">'  + pt.date + '</span>' +
          '<span class="set">' + pt.w + '\u202fkg\u202f\xd7\u202f' + pt.r + '</span>' +
          '<span class="rir">' + rir + '</span>' +
          '<span class="e1">'  + pt.e1 + '</span>';
        tbl.appendChild(tr);
      });

      inner.appendChild(name);
      inner.appendChild(sc);
      inner.appendChild(cw);
      inner.appendChild(tbl);
      pane.appendChild(inner);

      /* Render chart once layout has settled after the rail-width transition */
      setTimeout(function () {
        var w = Math.min(940, Math.max(480, (inner.clientWidth || 800) - 4));
        cn.setAttribute('data-w', String(w));
        if (window.__chartRender) window.__chartRender(cn);
      }, 450);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
